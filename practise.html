<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HTML Table Example</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            font-family: sans-serif;
            margin: 20px 0;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        thead {
            background-color: #009879;
            color: #ffffff;
        }
        tbody tr:hover {
            background-color: #f5f5f5;
        }
        tfoot {
            font-weight: bold;
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>

    <table>
        <caption>Employee Salary Directory</caption>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Role</th>
                <th>Salary</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>001</td>
                <td>Jane Doe</td>
                <td>Software Engineer</td>
                <td>$95,000</td>
            </tr>
            <tr>
                <td>002</td>
                <td>John Smith</td>
                <td>UX Designer</td>
                <td>$88,000</td>
            </tr>
            <tr>
                <td>003</td>
                <td>Alex Wong</td>
                <td>Product Manager</td>
                <td>$105,000</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="3">Total Budget</td>
                <td>$288,000</td>
            </tr>
        </tfoot>
    </table>

</body>
</html>
